#
# cPanel / AlmaLinux — Dahua EZAPI on the main HTTPS vhost (port 443)
#
# Install (as root), then rebuild Apache:
#   cp scripts/httpd-dahua-ezapi-vps.conf /etc/apache2/conf.d/userdata/ssl/2_4/<user>/<domain>/dahua-ezapi.conf
#   /scripts/ensure_phpconf
#   /scripts/rebuildhttpdconf
#   /scripts/restartsrv_httpd
#
# Why: terminals speak HTTP/1.1 with Content-Length. HTTP/2 or gzip/chunked
# leaves the device retrying GET /ezapi/push/init forever (never /request).

<IfModule mod_headers.c>
    RequestHeader unset Expect early
</IfModule>

<Location /ezapi>
    Protocols http/1.1
    SetEnv no-gzip 1
    SetEnv no-brotli 1
</Location>
