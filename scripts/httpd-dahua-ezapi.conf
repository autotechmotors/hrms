#
# Dahua EZAPI HTTPS — Laravel /ezapi/push/* without php artisan dahua:listen
# Device: 192.168.1.68:60002
#
Listen 60002

# Dahua firmware HTTP is not fully strict; default Apache 2.4 rejects with 400.
HttpProtocolOptions Unsafe

<VirtualHost *:60002>
    ServerName 192.168.1.68
    DocumentRoot "D:/hrms/public"

    <Directory "D:/hrms/public">
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    ErrorLog "C:/xampp/apache/logs/dahua-ezapi-error.log"
    CustomLog "C:/xampp/apache/logs/dahua-ezapi-access.log" combined

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5:!RC4:!3DES
    SSLHonorCipherOrder on
    SSLCertificateFile "D:/hrms/resources/dahua/certs/cert.pem"
    SSLCertificateKeyFile "D:/hrms/resources/dahua/certs/key.pem"

    Timeout 120

    # Dahua Expect: 100-continue often breaks init behind Apache
    <IfModule mod_headers.c>
        RequestHeader unset Expect early
    </IfModule>
</VirtualHost>
